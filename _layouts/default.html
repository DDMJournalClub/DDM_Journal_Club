<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  
  <!-- CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  
  <!-- 如需使用 Font Awesome 图标，取消注释 -->
  <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> -->
  
  <!-- RSS feed -->
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <!-- 导航栏 -->
  <header class="site-header">
    <div class="container">
      <a href="{{ '/' | relative_url }}" class="site-logo">
        <span class="logo-text">DDMJC</span>
      </a>
      <nav class="site-nav">
        {% for item in site.navigation %}
        <a href="{{ item.url | relative_url }}" class="nav-link{% if page.url == item.url %} active{% endif %}">{{ item.title }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>

  <!-- 主内容 -->
  <main class="site-main">
    <div class="container">
      {{ content }}
    </div>
  </main>

  <!-- 页脚 -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-section">
          <h4>DDMJC</h4>
          <p>{{ site.description }}</p>
        </div>
        <div class="footer-section">
          <h4>链接</h4>
          <ul class="footer-links">
            <li><a href="https://space.bilibili.com/3461571806235136" target="_blank" rel="noopener">Bilibili</a></li>
            <li><a href="https://github.com/ddmjc" target="_blank" rel="noopener">GitHub</a></li>
          </ul>
        </div>
        <div class="footer-section">
          <h4>赞助</h4>
          <ul class="footer-links">
            {% for sponsor in site.sponsors %}
            <li><a href="{{ sponsor.url }}" target="_blank" rel="noopener">{{ sponsor.name }}</a></li>
            {% endfor %}
          </ul>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; {{ site.time | date: '%Y' }} {{ site.author.name }}. 基于 <a href="https://jekyllrb.com" target="_blank" rel="noopener">Jekyll</a> 构建。</p>
      </div>
    </div>
  </footer>
</body>
</html>
