---
layout: default
---

<style>
  /* Post-specific styles */
  .post-header {
    margin-bottom: var(--space-2xl);
    padding-bottom: var(--space-lg);
    border-bottom: 1px solid var(--color-border);
  }
  
  .post-title {
    font-size: 2rem;
    font-weight: 700;
    color: var(--color-primary-dark);
    margin-bottom: var(--space-md);
  }
  
  .post-meta {
    display: flex;
    gap: var(--space-lg);
    color: var(--color-text-light);
    font-size: 0.9rem;
    margin-bottom: var(--space-lg);
  }
  
  .post-meta-item {
    display: flex;
    align-items: center;
    gap: var(--space-xs);
  }
  
  /* Speaker photo float right */
  .speaker-photo {
    float: right;
    max-width: 250px;
    margin-left: var(--space-lg);
    margin-bottom: var(--space-md);
    border-radius: 8px;
    box-shadow: var(--shadow-md);
  }
  
  .clearfix::after {
    content: "";
    clear: both;
    display: table;
  }
  
  /* Markdown content styling */
  .post-content h2 {
    color: var(--color-primary);
    font-size: 1.1rem;
    margin-top: var(--space-lg);
    margin-bottom: var(--space-sm);
  }
  
  .post-content hr {
    border: 0;
    border-top: 1px solid var(--color-border-light);
    margin: var(--space-lg) 0;
  }
  
  .post-content p {
    margin-bottom: var(--space-md);
    line-height: 1.7;
  }
  
  .post-tags {
    display: flex;
    gap: var(--space-xs);
    flex-wrap: wrap;
    margin-top: var(--space-md);
  }
</style>

<article class="post clearfix">
  <!-- Post Header -->
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <div class="post-meta">
      <span class="post-meta-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        {{ page.date | date: "%Y年%m月%d日" }}
      </span>
      <span class="post-meta-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        {{ page.time }}
      </span>
      {% if page.zoom_id %}
      <span class="post-meta-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15.05 5A5 5 0 0 1 19 8.95M15.05 1A9 9 0 0 1 23 8.94m-1 7.98v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
        </svg>
        ZOOM: {{ page.zoom_id }}
      </span>
      {% endif %}
    </div>
    {% if page.tags %}
    <div class="post-tags">
      {% for tag in page.tags %}
      <span class="tag">{{ tag }}</span>
      {% endfor %}
    </div>
    {% endif %}
  </header>

  <!-- Post Content with Speaker Photo -->
  <div class="post-content clearfix">
    {% if page.speaker_image %}
    <img src="{{ page.speaker_image | relative_url }}" alt="{{ page.speaker }}" class="speaker-photo">
    {% endif %}
    
    {{ content }}
  </div>
</article>

<!-- Back to Schedule -->
<section class="section" style="margin-top: var(--space-2xl); text-align: center;">
  <a href="{{ '/schedule/' | relative_url }}" class="btn btn-secondary">
    ← 返回日程安排
  </a>
</section>
