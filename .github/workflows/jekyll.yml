# DDMJC 静态网站 - GitHub Actions 工作流
# 用于构建和部署 Jekyll 网站到 GitHub Pages

name: Deploy DDMJC Site

on:
  push:
    branches:
      - main  # 当 main 分支有推送时触发
      - feature/static-site  # 开发分支也触发，方便测试
  workflow_dispatch:  # 允许手动触发

# 设置并发组，防止多个部署同时运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 构建和部署作业
  deploy:
    runs-on: ubuntu-latest
    
    # 只有当推送的是指定的分支时才运行
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/static-site'
    
    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4
      
      # 2. 设置 Ruby 环境
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'  # 使用 Ruby 3.1
          bundler-cache: true  # 缓存 gems 依赖
      
      # 3. 安装 Jekyll 依赖
      - name: Install dependencies
        run: |
          gem install jekyll
          gem install jekyll-feed jekyll-seo-tag jekyll-sitemap
      
      # 4. 构建 Jekyll 网站
      - name: Build Jekyll site
        run: |
          jekyll build --destination _site
      
      # 5. 上传到 GitHub Pages
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages  # 部署到 gh-pages 分支
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          # 如果需要自定义域名，取消注释下面一行
          # cname: ddmjc.example.com

# 备用方案：使用 GitHub Pages 原生支持（无需 Actions）
# 如果使用此方案，只需要确保 _config.yml 正确配置即可
# 详细参考: https://docs.github.com/en/pages/setting-up-a-github-pages-site-with-jekyll